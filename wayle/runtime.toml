[general]
font-sans = "NotoMono Nerd Font"

[bar]
scale = 0.800000011920929
background-opacity = 0
button-variant = "basic"
button-bg-opacity = 57

[[bar.layout]]
monitor = "*"
show = true
left = [
    "media",
    "ram",
    "cpu",
    "hyprland-workspaces",
]
center = [
    "clock",
    "weather",
]
right = [
    "battery",
    "bluetooth",
    "network",
    "microphone",
    "volume",
    "notifications",
    "systray",
]

[styling.palette]
bg = "#11111b"
surface = "#181825"
elevated = "#1e1e2e"
fg = "#cdd6f4"
fg-muted = "#bac2de"
primary = "#b4befe"
red = "#f38ba8"
yellow = "#f9e2af"
green = "#a6e3a1"
blue = "#74c7ec"

[modules.clock]
format = "%a %b %d %H:%M"

[modules.weather]
location = "Edmonton"

[wallpaper]
engine-enabled = false
